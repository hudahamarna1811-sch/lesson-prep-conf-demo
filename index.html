<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>منصة التحضير الذكي للدروس</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;}
  .card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .icon{font-size:34px;margin-bottom:10px;}
  h1{color:#e2e8f0;font-size:17px;margin:0 0 6px;}
  p{color:#94a3b8;font-size:12px;line-height:1.8;margin:0 0 18px;}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;text-align:center;font-size:15px;margin-bottom:10px;}
  input:focus{outline:none;border-color:#f59e0b;}
  .err{color:#fca5a5;font-size:12px;min-height:16px;margin-bottom:10px;}
  button{width:100%;padding:11px;border:none;border-radius:10px;background:#f59e0b;color:#0f172a;font-weight:bold;cursor:pointer;font-size:14px;}
  button:disabled{opacity:.6;cursor:wait;}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="icon">🔒</div>
    <h1>منصة التحضير الذكي للدروس</h1>
    <p>أدخلي رمز الدخول للمتابعة</p>
    <input id="code" type="password" placeholder="رمز الدخول" dir="ltr" autofocus>
    <div class="err" id="err"></div>
    <button id="btn" type="submit">دخول</button>
  </form>
<script>
(function(){
  var f=document.getElementById('f'), code=document.getElementById('code'),
      err=document.getElementById('err'), btn=document.getElementById('btn');

  // إذا كانت الجلسة قائمة، ندخل مباشرة
  fetch('/api/login',{credentials:'same-origin'}).then(function(r){return r.json();})
    .then(function(j){ if(j && j.authed) location.replace('/app' + location.search); })
    .catch(function(){});

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent=''; btn.disabled=true;
    fetch('/api/login',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code.value})
    }).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){ return {ok:r.ok,j:j}; });
    }).then(function(x){
      if(x.ok){ location.replace('/app' + location.search); return; }
      err.textContent = (x.j && x.j.message) || 'تعذّر الدخول. حاولي مرة أخرى.';
      code.value=''; code.focus(); btn.disabled=false;
    }).catch(function(){
      err.textContent='تعذّر الاتصال بالخادم. تأكدي من الإنترنت.'; btn.disabled=false;
    });
  });
})();
</script>
</body>
</html>
